<!DOCTYPE html>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f7f9fc;
    color: #1a1a1a;
}

/* Layout */
.container {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    background: #0a2540;
    color: white;
    padding: 40px 30px;
}

.sidebar h1 {
    font-size: 1.4em;
    margin-bottom: 10px;
    line-height: 1.4;
}

.sidebar .subtitle {
    font-size: 0.9em;
    color: #cfd8e3;
    margin-bottom: 40px;
}

.sidebar a {
    color: #cfd8e3;
    text-decoration: none;
}

.sidebar a:hover {
    text-decoration: underline;
}

.nav a {
    display: block;
    color: #cfd8e3;
    text-decoration: none;
    padding: 10px 0;
    font-size: 1em;
}

.nav a:hover {
    color: white;
}

/* Main content */
.content {
    padding: 60px 80px;
    background: white;
}

h2 {
    font-size: 1.6em;
    color: #0a2540;
    margin-top: 0;
    margin-bottom: 20px;
    border-bottom: 1px solid #e1e4e8;
    padding-bottom: 6px;
}

/* Tables */
table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.95em;
    background: #ffffff;
    box-shadow: 0 0 0 1px #e5e7eb;
    border-radius: 6px;
    overflow: hidden;
}

th {
    background: #f1f5f9;
    text-align: left;
    padding: 12px 12px;
    font-weight: 600;
    color: #0a2540;
    border-bottom: 1px solid #e5e7eb;
}

td {
    padding: 12px 12px;
    border-bottom: 1px solid #e5e7eb;
}

tr:last-child td {
    border-bottom: none;
}

tr:nth-child(even) td {
    background: #fafbfc;
}

/* Links */
a {
    color: #0056d6;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

/* Codes list */
.codes ul {
    list-style-type: none;
    padding-left: 0;
}

.codes li {
    padding: 8px 0;
    border-bottom: 1px solid #e1e4e8;
}
</style>

</head>
